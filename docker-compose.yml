services:
  app:
    container_name: poestaka_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=poestaka_password
      - DB_NAME=poestaka_db
      - FINE_PER_DAY=2000
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: poestaka_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: poestaka_password
      MYSQL_DATABASE: poestaka_db
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Auto-seed the database on first run
      - ./database/setup.sql:/docker-entrypoint-initdb.d/setup.sql
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

volumes:
  db_data:
